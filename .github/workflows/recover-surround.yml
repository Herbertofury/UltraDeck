name: Recover UltraDeck Surround

on:
  push:
    branches:
      - recovery/surround-mode
    paths:
      - 'bootstrap-surround/ready'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore recovered implementation
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-surround/payload.b64.* | base64 -d > /tmp/ultradeck-surround-recovery.tar.gz
          echo 'ca63fbc4eef8c0c0814025b95513c050ed214337a0beeb4dce138c4c1b8b92cc  /tmp/ultradeck-surround-recovery.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ultradeck-surround-recovery.tar.gz -C .
      - name: Build and verify recovered feature
        shell: bash
        run: |
          set -euo pipefail
          python3 shared-runtime-source/build_runtime.py
          python3 scripts/build_portable.py
          python3 -m py_compile shared-runtime-source/build_runtime.py scripts/build_portable.py scripts/package_release.py tests/test_surround_contract.py tests/verify_surround_browser.py
          node --check shared-runtime-source/surround-mode.js
          node --check public/options.js
          node --check dist-manual/chromium-mv3/runtime-main.js
          node --check dist-manual/firefox-mv3/runtime-main.js
          python3 tests/test_surround_contract.py
          python3 tests/verify_surround_browser.py
      - name: Publish recovered branch checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap-surround .github/workflows/recover-surround.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add opt-in surround layout mode'
          git push origin HEAD:recovery/surround-mode
