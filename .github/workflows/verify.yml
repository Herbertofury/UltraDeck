name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 shared-runtime-source/build_runtime.py
      - run: python3 scripts/build_portable.py
      - run: python3 -m py_compile shared-runtime-source/build_runtime.py scripts/build_portable.py
      - run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          for browser in ('chromium-mv3','firefox-mv3'):
              m=json.loads((root/'dist-manual'/browser/'manifest.json').read_text())
              assert m['version']=='8.2.0'
          body=(root/'shared-runtime-source/ultradeck-runtime-body.js').read_text()
          assert 'content-visibility' not in body.lower()
          assert 'identityMutationSkips' in body
          PY
