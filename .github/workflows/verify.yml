name: verify
on:
  push:
    paths-ignore:
      - 'bootstrap-v84/**'
  pull_request:
jobs:
  portable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 shared-runtime-source/build_runtime.py
      - run: python3 scripts/build_portable.py
      - run: python3 -m py_compile shared-runtime-source/build_runtime.py scripts/build_portable.py
      - run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          for browser in ('chromium-mv3','firefox-mv3'):
              m=json.loads((root/'dist-manual'/browser/'manifest.json').read_text())
              assert m['version']=='8.4.0'
          body=(root/'shared-runtime-source/ultradeck-runtime-body.js').read_text()
          assert 'content-visibility' not in body.lower()
          assert 'identityMutationSkips' in body
          assert 'interactionAutoRetries' in body
          assert 'annotateInteractionMirror' in body
          assert 'INTERACTION_CONTEXT_STORAGE_KEY' in body
          assert 'missingStickyInteractionContext' in body
          assert 'interactionDraftSyncRetries' in body
          PY
