name: verify
on:
  push:
  pull_request:
jobs:
  portable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: python3 -m pip install --disable-pip-version-check playwright
      - run: python3 -m playwright install chromium
      - run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"ULTRADECK_CHROMIUM_EXECUTABLE={p.chromium.executable_path}")
          PY
      - run: python3 shared-runtime-source/build_runtime.py
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:firefox
      - run: python3 scripts/build_portable.py
      - run: python3 -m py_compile shared-runtime-source/build_runtime.py scripts/build_portable.py scripts/package_release.py tests/test_site_regression_contract.py tests/verify_site_visuals.py tests/test_surround_contract.py tests/verify_surround_browser.py
      - run: node --check shared-runtime-source/ultradeck-runtime-body.js
      - run: node --check shared-runtime-source/site-hardening.js
      - run: node --check shared-runtime-source/surround-mode.js
      - run: node --check dist-manual/chromium-mv3/runtime-main.js
      - run: node --check dist-manual/chromium-mv3/site-loader.js
      - run: node --check dist-manual/chromium-mv3/bridge.js
      - run: node --check dist-manual/firefox-mv3/runtime-main.js
      - run: python3 tests/test_site_regression_contract.py
      - run: python3 tests/test_surround_contract.py
      - run: python3 tests/verify_surround_browser.py
      - run: xvfb-run -a env ULTRADECK_HEADED=1 ULTRADECK_EXPECT_VERSION=8.6.0 python3 tests/verify_site_visuals.py
      - run: xvfb-run -a env ULTRADECK_HEADED=1 ULTRADECK_EXPECT_VERSION=8.6.0 python3 tests/test_v85_site_options.py
      - run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          root=pathlib.Path('.')
          required_hosts={'https://www.tumblr.com/*','https://www.patreon.com/*','https://x.com/*','https://twitter.com/*','https://www.tiktok.com/*'}
          for browser in ('chromium-mv3','firefox-mv3'):
              out=root/'dist-manual'/browser
              m=json.loads((out/'manifest.json').read_text())
              assert m['version']=='8.6.0'
              assert required_hosts.issubset(set(m['host_permissions']))
              assert m['options_ui']['page']=='options.html'
              assert len(m['content_scripts'])==1
              assert m['content_scripts'][0]['world']=='ISOLATED'
              assert (out/'site-loader.js').is_file()
              assert (out/'site-tiktok.js').is_file()
              assert (out/'options.html').is_file() and (out/'options.js').is_file()
          body=(root/'shared-runtime-source/ultradeck-runtime-body.js').read_text()
          hardening=(root/'shared-runtime-source/site-hardening.js').read_text()
          surround=(root/'shared-runtime-source/surround-mode.js').read_text()
          assert 'content-visibility' not in (body+hardening+surround).lower()
          assert 'identityMutationSkips' in body
          assert 'interactionAutoRetries' in body
          assert 'INTERACTION_CONTEXT_STORAGE_KEY' in body
          for browser in ('chromium-mv3','firefox-mv3'):
              src=root/'dist-manual'/browser
              dest=root/f'UltraDeck-Extension-v8.6.0-{browser}.zip'
              with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(src.rglob('*')):
                      if p.is_file(): z.write(p,p.relative_to(src))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UltraDeck-v8.6.0-regression-fixed
          if-no-files-found: error
          path: |
            UltraDeck-Extension-v8.6.0-chromium-mv3.zip
            UltraDeck-Extension-v8.6.0-firefox-mv3.zip
            artifacts/visual-verification/*.png
            artifacts/visual-verification/visual-verification.json
