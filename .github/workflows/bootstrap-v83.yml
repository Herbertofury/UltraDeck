name: Publish UltraDeck v8.3.0

on:
  push:
    paths:
      - 'bootstrap-v83/ready'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply verified v8.3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-v83/patch/patch.b64.* | base64 -d > /tmp/ud83.patch.gz
          echo '14d10529b8331605f0815e2fe1fdf0ce1c8f6e0f224fbce8fb5e150822d32193  /tmp/ud83.patch.gz' | sha256sum -c -
          gzip -dc /tmp/ud83.patch.gz > /tmp/ud83.patch
          git apply --check /tmp/ud83.patch
          git apply /tmp/ud83.patch
          test "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" = '8.3.0'

      - name: Build v8.3.0
        shell: bash
        run: |
          set -euo pipefail
          python3 shared-runtime-source/build_runtime.py
          python3 scripts/build_portable.py
          python3 -m py_compile \
            shared-runtime-source/build_runtime.py \
            scripts/build_portable.py \
            tests/test_v83_interaction_capsules.py \
            tests/test_v82_jank_sites.py \
            tests/test_v74_no_cap_scale.py \
            tests/test_v8_multisite_extension.py
          node --check shared-runtime-source/ultradeck-runtime-body.js
          node --check dist-manual/chromium-mv3/runtime-main.js
          test "$(python3 -c 'import json; print(json.load(open("dist-manual/chromium-mv3/manifest.json"))["version"])')" = '8.3.0'
          test "$(python3 -c 'import json; print(json.load(open("dist-manual/firefox-mv3/manifest.json"))["version"])')" = '8.3.0'

      - name: Package exact v8.3.0 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases/v8.3.0
          mkdir -p releases/v8.3.0
          cp dist/Patreon-UltraWide-Deck-v8.3.0.user.js releases/v8.3.0/
          cp dist/Tumblr-UltraWide-Deck-v8.3.0.user.js releases/v8.3.0/
          cp dist/X-UltraWide-Deck-v8.3.0.user.js releases/v8.3.0/
          cp docs/VERIFICATION-v8.3.0.md releases/v8.3.0/VERIFICATION.md
          cp docs/VERIFICATION-v8.3.0.json releases/v8.3.0/VERIFICATION.json
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          FIXED = (2026, 8, 16, 0, 0, 0)

          def add_file(z, path, arcname):
              info = zipfile.ZipInfo(str(arcname).replace('\\', '/'), date_time=FIXED)
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = (path.stat().st_mode & 0xFFFF) << 16
              z.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          def zip_tree(src, out):
              src = Path(src)
              with zipfile.ZipFile(out, 'w') as z:
                  for path in sorted(src.rglob('*')):
                      if path.is_file():
                          add_file(z, path, path.relative_to(src))

          zip_tree('dist-manual/chromium-mv3', 'releases/v8.3.0/UltraDeck-Extension-v8.3.0-chromium-mv3.zip')
          zip_tree('dist-manual/firefox-mv3', 'releases/v8.3.0/UltraDeck-Extension-v8.3.0-firefox-mv3.zip')

          excluded = {'.git', 'releases', 'dist', 'dist-manual', 'src', 'node_modules', '.wxt', '__pycache__', '.pytest_cache', 'bootstrap-v83'}
          with zipfile.ZipFile('releases/v8.3.0/UltraDeck-Extension-v8.3.0-source.zip', 'w') as z:
              for path in sorted(Path('.').rglob('*')):
                  if not path.is_file() or any(part in excluded for part in path.parts):
                      continue
                  if path.as_posix() == '.github/workflows/bootstrap-v83.yml':
                      continue
                  arcname = Path('UltraDeck-Extension-v8.3.0') / path
                  add_file(z, path, arcname)
          PY
          cd releases/v8.3.0
          sha256sum \
            Patreon-UltraWide-Deck-v8.3.0.user.js \
            Tumblr-UltraWide-Deck-v8.3.0.user.js \
            X-UltraWide-Deck-v8.3.0.user.js \
            UltraDeck-Extension-v8.3.0-chromium-mv3.zip \
            UltraDeck-Extension-v8.3.0-firefox-mv3.zip \
            UltraDeck-Extension-v8.3.0-source.zip \
            VERIFICATION.md VERIFICATION.json > SHA256SUMS.txt
          cat > /tmp/ud83-expected.sha256 <<'EOF'
          4653efc1fbe6768e83996ed9604006ef2595c6b9a72fd857e96604d2de7ffa27  Patreon-UltraWide-Deck-v8.3.0.user.js
          59217f0f33a1e0f345bfdff8dbf6c9fbb77958501a0349f767c90eb15576e5b0  Tumblr-UltraWide-Deck-v8.3.0.user.js
          1b289260b326508506508d58a48ac61146f9a9a14175f839b553bbfdf0707769  X-UltraWide-Deck-v8.3.0.user.js
          0692cd74ea8714ba339ff3d3ae2441381e48d61a93eea4b3071f3234bf5a1080  UltraDeck-Extension-v8.3.0-chromium-mv3.zip
          0297134358b91a291e29d03e3683c7a01dd514b3cdb5cba9cc2a31886ac40c51  UltraDeck-Extension-v8.3.0-firefox-mv3.zip
          0b835d8743bdc00950367309f794a6a6bc0fc18b8ff7420c54d1d8d33f1a32d9  UltraDeck-Extension-v8.3.0-source.zip
          95c494c5bad437e4da4729a95eb953568f64f804a283b8fa8a420c8344ea6a9b  VERIFICATION.md
          69afbee8150976affa2619b860761e49979ef23e32a9a88d6ee28bf1aebf48bd  VERIFICATION.json
          EOF
          sha256sum -c /tmp/ud83-expected.sha256
          diff -u /tmp/ud83-expected.sha256 SHA256SUMS.txt
          cd ../..

      - name: Publish v8.3.0 source and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf bootstrap-v83
          git checkout HEAD -- .github/workflows/verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release UltraDeck v8.3.0'
          git push origin HEAD:main
          if gh release view v8.3.0 >/dev/null 2>&1; then
            gh release upload v8.3.0 releases/v8.3.0/* --clobber
          else
            gh release create v8.3.0 releases/v8.3.0/* \
              --title 'UltraDeck v8.3.0' \
              --notes-file docs/VERIFICATION-v8.3.0.md \
              --target main
          fi
