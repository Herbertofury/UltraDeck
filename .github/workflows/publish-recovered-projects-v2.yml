name: Publish recovered UltraDeck and Pinterest Nocturne v2

on:
  push:
    branches:
      - recovery/ultradeck-v8.1-pinterest-1.9
    paths:
      - .github/workflows/publish-recovered-projects-v2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether main is already published
        id: precheck
        shell: bash
        run: |
          if curl --fail --silent --location 'https://raw.githubusercontent.com/Herbertofury/UltraDeck/main/PUBLISH_PROOF.json' | grep -q '"materialization": "verified"'; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize and verify recovered sources
        if: steps.precheck.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          STAGE=/tmp/recovered-stage
          PUB=/tmp/publish-tree
          rm -rf "$STAGE" "$PUB" /tmp/pn-build
          mkdir -p "$STAGE" "$PUB/releases"

          cat \
            payloads/ultradeck-source.tar.xz.b64.part000 \
            payloads/ultradeck-source.tar.xz.b64.part001 \
            payloads/ultradeck-source.tar.xz.b64.part002 \
            payloads/ultradeck-source.tar.xz.b64.part003 \
            payloads/ultradeck-source.tar.xz.b64.part004 \
            payloads/ultradeck-source.tar.xz.b64.part005 \
            payloads/ultradeck-source.tar.xz.b64.part006 \
            payloads/ultradeck-source.tar.xz.b64.part007 \
            | tr -d '\r\n' | base64 -d > /tmp/ultradeck-source.tar.xz
          echo '2461d127185d28438f895fdd2c5d4c66bcb0d186735c058fbc36b330a3147768  /tmp/ultradeck-source.tar.xz' | sha256sum -c -

          PN_BASE='https://filebin.net/udpn-20260815-7b05f66c170322377333628bafb56034'
          curl --fail --location --retry 5 --retry-all-errors "$PN_BASE/pinterest-nocturne-source.tar.xz" -o /tmp/pinterest-nocturne-source.tar.xz
          curl --fail --location --retry 5 --retry-all-errors "$PN_BASE/Pinterest-Nocturne-1.9.0-Source.zip" -o /tmp/Pinterest-Nocturne-1.9.0-Source.zip
          echo '7b05f66c170322377333628bafb560341667dbd1b498f64167245efe49c9877e  /tmp/pinterest-nocturne-source.tar.xz' | sha256sum -c -
          echo 'e2fa38831c8969fc4a8b1919f92a69e1e50dec607a5c6425ee2e3b5a6734a8d7  /tmp/Pinterest-Nocturne-1.9.0-Source.zip' | sha256sum -c -

          tar -xJf /tmp/ultradeck-source.tar.xz -C "$STAGE"
          tar -xJf /tmp/pinterest-nocturne-source.tar.xz -C "$STAGE"
          test -d "$STAGE/ultradeck"
          test -d "$STAGE/pinterest-nocturne"
          test -f "$STAGE/ultradeck/shared-runtime-source/adapters/patreon.js"
          test -f "$STAGE/ultradeck/shared-runtime-source/adapters/x.js"
          test -f "$STAGE/pinterest-nocturne/src/manifest.json"

          if find "$STAGE/ultradeck" "$STAGE/pinterest-nocturne" -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -iname '*cookie*' -o -iname '*credential*' \) | grep -q .; then
            echo 'Sensitive-looking filename found in source tree.' >&2
            exit 1
          fi
          if grep -RInE --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.zip' '(BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|client[_-]?secret[[:space:]]*[:=]|access[_-]?token[[:space:]]*[:=]|authorization:[[:space:]]*bearer)' "$STAGE/ultradeck" "$STAGE/pinterest-nocturne"; then
            echo 'Potential secret pattern found in source tree.' >&2
            exit 1
          fi

          cd "$STAGE/ultradeck"
          python3 -m py_compile scripts/build_portable.py shared-runtime-source/build_runtime.py
          python3 scripts/build_portable.py
          find dist dist-manual shared-runtime-source src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

          cp -a "$STAGE/ultradeck" "$PUB/ultradeck"
          cp -a "$STAGE/pinterest-nocturne" "$PUB/pinterest-nocturne"
          cp dist/Patreon-UltraWide-Deck-v8.1.0.user.js "$PUB/releases/"
          cp dist/Tumblr-UltraWide-Deck-v8.1.0.user.js "$PUB/releases/"
          cp dist/X-UltraWide-Deck-v8.1.0.user.js "$PUB/releases/"
          (cd dist-manual/chromium-mv3 && zip -qr "$PUB/releases/UltraDeck-Extension-v8.1.0-chromium-mv3.zip" .)
          (cd dist-manual/firefox-mv3 && zip -qr "$PUB/releases/UltraDeck-Extension-v8.1.0-firefox-mv3.zip" .)
          (cd "$STAGE/ultradeck" && zip -qr "$PUB/releases/UltraDeck-v8.1.0-source.zip" . -x 'dist-manual/*' 'node_modules/*' '.wxt/*' '*/__pycache__/*' '*.pyc')

          cp /tmp/Pinterest-Nocturne-1.9.0-Source.zip "$PUB/releases/Pinterest-Nocturne-1.9.0-Source.zip"
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path('/tmp/recovered-stage/pinterest-nocturne')
          out = Path('/tmp/pn-build')
          shutil.rmtree(out, ignore_errors=True)
          for browser in ('chromium', 'firefox'):
              dst = out / browser
              shutil.copytree(root / 'src', dst)
              manifest_path = dst / 'manifest.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if browser == 'chromium':
                  manifest['background'] = {'service_worker': 'background/background.js'}
                  manifest.pop('browser_specific_settings', None)
              else:
                  manifest['background'] = {'scripts': ['background/background.js']}
              manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          find /tmp/pn-build -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          (cd /tmp/pn-build/chromium && zip -qr "$PUB/releases/pinterest-nocturne-1.9.0-chromium.zip" .)
          (cd /tmp/pn-build/firefox && zip -qr "$PUB/releases/pinterest-nocturne-1.9.0-firefox.zip" .)

          for archive in "$PUB"/releases/*.zip; do unzip -tq "$archive" >/dev/null; done
          cp "$STAGE/ultradeck/VERIFICATION.md" "$PUB/VERIFICATION.md"

          cat > "$PUB/README.md" <<'EOF'
          # UltraDeck + Pinterest Nocturne

          This repository preserves and publishes the newest recovered project states from the recovery audit.

          ## UltraDeck v8.1.0

          UltraDeck is a lossless ultrawide multi-column feed engine for Tumblr, Patreon, X, and the Twitter compatibility hostname. This v8.1.0 source was reconstructed from the exact verified v8.0.0 baseline, the newest recovered v8.1.0 WIP-009 source patch, and a current Patreon/X hardening pass.

          The hardening includes selected feed/tab state in route identity, X timestamp-permalink post identity, exact X source restoration, current X primary-column semantics, Patreon role=article/permalink fallback, expanded native action aliases, and preserved off-screen native-control restoration without viewport culling or retained-card limits.

          Downloads:

          - [UltraDeck v8.1.0 complete source](releases/UltraDeck-v8.1.0-source.zip)
          - [UltraDeck Chromium MV3](releases/UltraDeck-Extension-v8.1.0-chromium-mv3.zip)
          - [UltraDeck Firefox MV3](releases/UltraDeck-Extension-v8.1.0-firefox-mv3.zip)
          - [Patreon userscript](releases/Patreon-UltraWide-Deck-v8.1.0.user.js)
          - [X / Twitter userscript](releases/X-UltraWide-Deck-v8.1.0.user.js)
          - [Tumblr userscript](releases/Tumblr-UltraWide-Deck-v8.1.0.user.js)

          ## Pinterest Nocturne v1.9.0

          The `pinterest-nocturne/` source tree is the newest substantively distinct connected-Drive v1.9.0 candidate recovered on 2026-08-12. The exact recovered Drive source ZIP is preserved byte-for-byte in the releases directory.

          Downloads:

          - [Exact recovered Pinterest Nocturne v1.9.0 source ZIP](releases/Pinterest-Nocturne-1.9.0-Source.zip)
          - [Pinterest Nocturne Chromium build](releases/pinterest-nocturne-1.9.0-chromium.zip)
          - [Pinterest Nocturne Firefox build](releases/pinterest-nocturne-1.9.0-firefox.zip)

          ## Verification

          See [VERIFICATION.md](VERIFICATION.md), [RELEASE-MANIFEST.json](RELEASE-MANIFEST.json), [PUBLISH_PROOF.json](PUBLISH_PROOF.json), and [SHA256SUMS.txt](SHA256SUMS.txt).

          The reproducible UltraDeck policy-isolated gates passed before publication, including Tumblr/Patreon/X retention and native actions, route partitioning, off-screen interaction recovery, popup controls, and the 2,000-card no-culling gate. Authenticated live production Patreon/X smoke testing remains an external confidence layer rather than a claim of universal zero-defect behavior.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import datetime, hashlib, json
          pub = Path('/tmp/publish-tree')
          artifacts = []
          for path in sorted((pub / 'releases').iterdir()):
              if path.is_file():
                  artifacts.append({'path': str(path.relative_to(pub)), 'size': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          manifest = {
              'generated_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'ultradeck': {
                  'version': '8.1.0',
                  'provenance': 'Exact verified v8.0.0 baseline + recovered WIP-009 source patch + Patreon/X semantic hardening',
                  'wip009_base_runtime_sha256': 'ef37eae1165d5b7565db3c33b8a69a94f72e5909d46bcdd9df141fa8b813a771',
                  'wip009_target_runtime_sha256': '2471fbaf66f1a456b5f6cea609c4c510a58dc8c3803f36f6e6e6f81bccdb8404',
                  'source_payload_sha256': '2461d127185d28438f895fdd2c5d4c66bcb0d186735c058fbc36b330a3147768',
                  'production_boundary': 'Reproducible policy-isolated gates passed; authenticated live Patreon/X smoke testing remains an external confidence layer.'
              },
              'pinterest_nocturne': {
                  'version': '1.9.0',
                  'provenance': 'Exact newest substantively distinct connected-Drive source candidate recovered 2026-08-12',
                  'recovered_source_zip_sha256': 'e2fa38831c8969fc4a8b1919f92a69e1e50dec607a5c6425ee2e3b5a6734a8d7',
                  'source_payload_sha256': '7b05f66c170322377333628bafb560341667dbd1b498f64167245efe49c9877e'
              },
              'artifacts': artifacts
          }
          (pub / 'RELEASE-MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          with (pub / 'SHA256SUMS.txt').open('w', encoding='utf-8') as f:
              for item in artifacts:
                  f.write(f"{item['sha256']}  {item['path']}\n")
          proof = {
              'materialization': 'verified',
              'ultradeck_payload_sha256': manifest['ultradeck']['source_payload_sha256'],
              'pinterest_payload_sha256': manifest['pinterest_nocturne']['source_payload_sha256'],
              'pinterest_exact_source_zip_sha256': manifest['pinterest_nocturne']['recovered_source_zip_sha256'],
              'secret_scan': 'passed',
              'javascript_parse_checks': 'passed',
              'archive_integrity': 'passed'
          }
          (pub / 'PUBLISH_PROOF.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit clean publication to main
        if: steps.precheck.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUB=/tmp/publish-tree
          git fetch origin main
          git checkout -B clean-publication origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$PUB"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish UltraDeck v8.1.0 and Pinterest Nocturne v1.9.0'
          git push origin HEAD:main

      - name: Remove temporary transfer bin
        if: always()
        shell: bash
        run: curl --silent --show-error --request DELETE 'https://filebin.net/udpn-20260815-7b05f66c170322377333628bafb56034' || true
