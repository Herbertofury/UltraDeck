name: Bootstrap UltraDeck v8.2.0

on:
  push:
    paths:
      - 'bootstrap/v82.ready'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/v82.b64.* | base64 -d > /tmp/ultradeck-source.zip
          echo 'b69d4a5e818d5f28c6427abed90de3a13010c70ae638026f683cbda17ece5691  /tmp/ultradeck-source.zip' | sha256sum -c -
          rm -rf /tmp/ud82
          mkdir -p /tmp/ud82
          unzip -q /tmp/ultradeck-source.zip -d /tmp/ud82
          rsync -a --delete --exclude='.git/' --exclude='bootstrap/' --exclude='.github/workflows/bootstrap-v82.yml' /tmp/ud82/UltraDeck-Extension-v8.2.0/ ./

      - name: Build portable distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 shared-runtime-source/build_runtime.py
          python3 scripts/build_portable.py
          python3 -m py_compile shared-runtime-source/build_runtime.py scripts/build_portable.py
          node --check shared-runtime-source/ultradeck-runtime-body.js

      - name: Package v8.2.0 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases/v8.2.0
          mkdir -p releases/v8.2.0
          cp dist/Patreon-UltraWide-Deck-v8.2.0.user.js releases/v8.2.0/
          cp dist/Tumblr-UltraWide-Deck-v8.2.0.user.js releases/v8.2.0/
          cp dist/X-UltraWide-Deck-v8.2.0.user.js releases/v8.2.0/
          cp docs/VERIFICATION-v8.2.0.md releases/v8.2.0/VERIFICATION.md
          cp docs/VERIFICATION-v8.2.0.json releases/v8.2.0/VERIFICATION.json
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          FIXED = (2026, 8, 16, 0, 0, 0)
          def add_file(z, path, arcname):
              info = zipfile.ZipInfo(str(arcname).replace('\\', '/'), date_time=FIXED)
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = (path.stat().st_mode & 0xFFFF) << 16
              z.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          def zip_tree(src, out):
              src = Path(src)
              with zipfile.ZipFile(out, 'w') as z:
                  for path in sorted(src.rglob('*')):
                      if path.is_file():
                          add_file(z, path, path.relative_to(src))

          zip_tree('dist-manual/chromium-mv3', 'releases/v8.2.0/UltraDeck-Extension-v8.2.0-chromium-mv3.zip')
          zip_tree('dist-manual/firefox-mv3', 'releases/v8.2.0/UltraDeck-Extension-v8.2.0-firefox-mv3.zip')

          excluded = {'.git', 'bootstrap', 'releases', 'dist', 'dist-manual', 'src', 'node_modules', '.wxt', '__pycache__', '.pytest_cache'}
          source_out = Path('releases/v8.2.0/UltraDeck-Extension-v8.2.0-source.zip')
          with zipfile.ZipFile(source_out, 'w') as z:
              for path in sorted(Path('.').rglob('*')):
                  if not path.is_file() or any(part in excluded for part in path.parts):
                      continue
                  if path.as_posix() == '.github/workflows/bootstrap-v82.yml':
                      continue
                  arc = Path('UltraDeck-Extension-v8.2.0') / path
                  add_file(z, path, arc)
          PY
          (cd releases/v8.2.0 && sha256sum \
            Patreon-UltraWide-Deck-v8.2.0.user.js \
            Tumblr-UltraWide-Deck-v8.2.0.user.js \
            X-UltraWide-Deck-v8.2.0.user.js \
            UltraDeck-Extension-v8.2.0-chromium-mv3.zip \
            UltraDeck-Extension-v8.2.0-firefox-mv3.zip \
            UltraDeck-Extension-v8.2.0-source.zip \
            VERIFICATION.md VERIFICATION.json > SHA256SUMS.txt)

      - name: Publish clean source and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-v82.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release UltraDeck v8.2.0'
          git push origin HEAD:main
          if gh release view v8.2.0 >/dev/null 2>&1; then
            gh release upload v8.2.0 releases/v8.2.0/* --clobber
          else
            gh release create v8.2.0 releases/v8.2.0/* \
              --title 'UltraDeck v8.2.0' \
              --notes-file docs/RELEASE-v8.2.0.md \
              --target main
          fi
