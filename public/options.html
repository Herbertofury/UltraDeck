<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UltraDeck Sites</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options-shell">
    <header>
      <div class="eyebrow">ULTRADECK v8.5.0</div>
      <h1>Enabled sites</h1>
      <p>Choose where UltraDeck is allowed to transform the native feed. Disabled sites stay completely native.</p>
    </header>
    <section class="site-list" aria-label="Supported sites">
      <label class="site-row"><span><strong>Tumblr</strong><small>www.tumblr.com</small></span><input id="site-tumblr" data-site="tumblr" type="checkbox"></label>
      <label class="site-row"><span><strong>Patreon</strong><small>www.patreon.com</small></span><input id="site-patreon" data-site="patreon" type="checkbox"></label>
      <label class="site-row"><span><strong>X / Twitter</strong><small>x.com and twitter.com</small></span><input id="site-x" data-site="x" type="checkbox"></label>
      <label class="site-row"><span><strong>TikTok</strong><small>www.tiktok.com</small></span><input id="site-tiktok" data-site="tiktok" type="checkbox"></label>
    </section>
    <section class="note">
      <strong>Changes apply to open tabs automatically.</strong>
      <p>UltraDeck reloads an affected supported tab only when that site's enabled state changes.</p>
    </section>
    <p id="save-state" class="save-state" role="status" aria-live="polite">Loading settings…</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
